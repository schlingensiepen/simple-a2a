[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-a2a"
version = "0.1.0.dev0"
description = "A server that lets software agents talk to each other: three surfaces, token-authenticated, self-describing."
readme = "README.md"
license = "Apache-2.0"
# One version, and it is the one that is tested. CI and the image both run
# 3.13; declaring more than that would be a claim no test backs. Widening
# this needs a version matrix first.
requires-python = ">=3.13"
authors = [{ name = "Jörn Schlingensiepen" }]
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "pydantic>=2.13",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient; everything else the suite needs is stdlib.
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
# The service itself, without a subcommand: there is no command line for
# operations, and the image's entry point is this one.
simple-a2a = "simple_a2a.__main__:main"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
