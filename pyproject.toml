[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-a2a"
version = "0.1.0"
description = "A server that lets software agents talk to each other: three surfaces, token-authenticated, self-describing."
readme = "README.md"
license = "Apache-2.0"
# One version, and it is the one that is tested. CI and the image both run
# 3.13; declaring more than that would be a claim no test backs. Widening
# this needs a version matrix first.
requires-python = ">=3.13"
authors = [{ name = "Jörn Schlingensiepen" }]
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "pydantic>=2.13",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient; everything else the suite needs is stdlib.
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
# The service itself: a bare start serves, and the image's entry point is this
# one. There is no command line for operations; the one word understood beside
# the bare start is `first-prompt`, a helper that prints the first prompt for an
# agent and reads nothing but the administration secret.
simple-a2a = "simple_a2a.__main__:main"

# The MCP program lives outside the package — it imports nothing from it — and is
# served by the participant surface as `/mcp.zip`. An installed service has no
# source tree to read it from, so the wheel carries a copy beside the module that
# serves it. File by file rather than the directory, so that nothing beside the
# two members can travel along. An editable install gets the copy as well, and
# never reads it: the package is then imported from src/, next to which there is
# no copy, so the files are read from mcp/ itself.
[tool.hatch.build.targets.wheel.force-include]
"mcp/README.md" = "simple_a2a/describe/mcp/README.md"
"mcp/simple_a2a_mcp.py" = "simple_a2a/describe/mcp/simple_a2a_mcp.py"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
