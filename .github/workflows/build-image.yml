# Building, smoke-testing and publishing: one artefact, three rollout forms.
#
# The same tree leaves here in two built forms — a package (wheel and sdist) and
# a container image — and the third form, the compose file under deploy/, is the
# image put behind a proxy. Delivery is by pull, so nobody stands at the far end
# and every check has to sit before publication or inside the artefact. That is
# the whole shape of this workflow: each built form is started and driven by the
# smoke test, and only what passed is published.
#
# The smoke test is tools/smoke.py, and it runs against both forms in the same
# order with the same checks: a bare start with no variable set at all; the
# token-free addresses — derived from the running instance, not listed here —
# answering on an empty holding exactly as on a full one, with a token
# presented where one is needed rejected as no token; no placeholder left in
# the skill package; the administration secret in the log exactly once,
# accepted, and an unissued one refused; the token cycle across all three
# surfaces including revoking twice; the three empty stages — no realm, a realm
# without a team, a team without a member; the secret still valid after a
# restart and not logged again; and the build stamp naming the commit it was
# built from.
#
# The package: built with `uv build`, the wheel installed into a virtual
# environment that has nothing else in it, and the installed entry point
# started by the smoke test. Not the source tree — what is tested is what a
# `pip install` gets, including the copy of the MCP program the wheel carries.
#
# The image: built with the commit as its build stamp and the build time beside
# it, started with nothing set but a volume of its own — removed afterwards,
# because it holds the secret the run generated — and restarted as a new
# container on the same volume, which is what an upgrade does, and the only way
# to show that the holdings and the secret live on the volume. The tested image
# is saved as a file and handed on; the push loads that file rather than
# building again, because a second build is a second artefact that nobody has
# started.
#
# When it publishes:
# - a tag `v*` builds, smoke-tests and pushes the image to
#   ghcr.io/<owner>/simple-a2a as the version and as `latest`, and attaches
#   wheel and sdist to a GitHub release created as a *draft*: a human reads it
#   and presses the button. The tag has to name the version the package says,
#   or nothing is published — a wheel called 0.1.0.dev0 under a release v0.1.0
#   is two answers to "which version is this".
# - a manual run builds and smoke-tests, and pushes only when asked to, under
#   `sha-<commit>` and never as `latest`: a manual run is not a release — not
#   even one started on a tag. Only the push of a tag counts as one, so every
#   step that releases asks for the event, not only for the ref.
# - a push to a branch publishes nothing. The suite for branches is ci.yml.
#
# Write permissions sit only in the job that uses them: packages for the push,
# contents for the draft release. Everything else reads.
name: Build, smoke-test and publish
on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the smoke-tested image as sha-<commit> (never as latest)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions: { contents: read }
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: "the package: built, installed into a clean environment, smoke-tested"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8, only exact version tags.
      - uses: astral-sh/setup-uv@v10.3.2
        with: { python-version: "3.13" }
      - name: "a tag names the version the package says"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, the package says ${version}"
            exit 1
          fi
      # The smoke test's own tests: that the addresses it derives are the ones
      # the code builds, counted from the routes and the guide parts, and that a
      # check which does not hold fails the run. Without this a tag on a commit
      # that never went through ci.yml would publish on a smoke test nobody
      # checked.
      - name: "the smoke test is itself tested"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q tests/test_smoke.py
      - name: "wheel and sdist"
        run: uv build --out-dir dist
      - name: "the wheel in an environment with nothing else in it"
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
      # The installed entry point, a bare start: the runner's default ports are
      # free, and the holdings go where a bare start puts them, which the smoke
      # test moves into its own working directory. The build stamp is not one of
      # the operational parameters, so setting it leaves the start bare.
      - name: "smoke test against the installed entry point"
        run: >-
          "$RUNNER_TEMP/clean/bin/python" tools/smoke.py
          --expect-build "$GITHUB_SHA"
          process
          --command "$RUNNER_TEMP/clean/bin/simple-a2a"
          --env "A2A_BUILD=$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: "the image: built, started, smoke-tested, saved"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "the build time"
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: "the image builds"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          tags: simple-a2a:smoke
          build-args: |
            A2A_BUILD=${{ github.sha }}
            A2A_BUILD_AT=${{ steps.stamp.outputs.at }}
      # The runner's own Python is enough: the smoke test is standard library
      # only, and it talks to the container through the published ports.
      - name: "smoke test against the image"
        run: >-
          python3 tools/smoke.py
          --expect-build "$GITHUB_SHA"
          --expect-built-at "${{ steps.stamp.outputs.at }}"
          container
          --image simple-a2a:smoke
          --name simple-a2a-smoke
      - name: "the tested image as a file"
        run: docker save simple-a2a:smoke | gzip > simple-a2a-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: simple-a2a-image.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: "push the image that passed"
    needs: [package, image]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: image }
      - name: "load the tested image, not a new build"
        run: gunzip -c simple-a2a-image.tar.gz | docker load
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "tag and push"
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simple-a2a"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags=("${GITHUB_REF_NAME#v}" latest)
          else
            tags=("sha-${GITHUB_SHA}")
          fi
          for tag in "${tags[@]}"; do
            docker tag simple-a2a:smoke "${repository}:${tag}"
            docker push "${repository}:${tag}"
          done

  draft-release:
    name: "a draft release with wheel and sdist"
    needs: [package, image, publish-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: package, path: dist }
      - name: "create the release as a draft"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simple-a2a:${GITHUB_REF_NAME#v}"
          dist/*
